spring:
    application:
        name: pedidos
    datasource:
        url: jdbc:postgresql://localhost:5432/icompraspedidos
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: none #isso porque ja tenho o banco de dados criado,
            # o certo é criar o banco de dados e depois mapear ele no spring
        show-sql: true
        properties:
            hibernate:
                format_sql: true

server:
    port: 8082

icompras:
    pedidos:
        clients:
            produtos:
                url: "http://localhost:8080/produtos"
            clientes:
                url: "http://localhost:8081/clientes"
    config:
        kafka:
            server-url: "http://localhost:29092"
            topics:
                pedidos-pagos: 'icompras.pedidos-pagos'
                pedidos-faturados: 'icompras.pedidos-faturados'
                pedidos-enviados: 'icompras.pedidos-enviados'