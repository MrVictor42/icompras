spring:
    application:
        name: pedidos
    datasource:
        url: jdbc:postgresql://localhost:5432/icompraspedidos
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: none #isso porque ja tenho o banco de dados criado,
            # o certo é criar o banco de dados e depois mapear ele no spring
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    kafka:
        bootstrap-servers:
            - "http://localhost:29092"
        consumer:
            group-id: icompras-atualizacao-pedido
            auto-offset-reset: earliest #Pega das mensagens mais antigas para as mais novas

server:
    port: ${SERVER_PORT:0}

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    instance:
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true

icompras:
    config:
        kafka:
            topics:
                pedidos-pagos: 'icompras.pedidos-pagos'
                pedidos-faturados: 'icompras.pedidos-faturados'
                pedidos-enviados: 'icompras.pedidos-enviados'