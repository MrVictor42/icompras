spring:
    application:
        name: faturamento
    kafka:
        bootstrap-servers:
            - "localhost:29092"
        consumer:
            group-id: icompras-faturamento
            auto-offset-reset: earliest #Pega das mensagens mais antigas para as mais novas

icompras:
    config:
        kafka:
            topics:
                pedidos-pagos: "icompras.pedidos-pagos"
                pedidos-faturados: "icompras.pedidos-faturados"

server:
    port: ${SERVER_PORT:0}

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    instance:
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true

rustfs:
    url: "http://localhost:9000"
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: icompras.faturas