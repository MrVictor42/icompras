services:
    rustfs:
        image: rustfs/rustfs:latest
        container_name: rusts
        ports:
            - "9000:9000" # API S3
            - "9001:9001" # Console Web
        environment:
            RUSTFS_ACCESS_KEY: minioadmin
            RUSTFS_SECRET_KEY: minioadmin
        volumes:
            - ./docs:/data
        command: /data
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true