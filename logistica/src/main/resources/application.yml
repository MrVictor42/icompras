spring:
    application:
        name: logistica
    kafka:
        bootstrap-servers:
            - "http://localhost:29092"
        consumer:
            group-id: icompras-logistica
            auto-offset-reset: earliest #Pega das mensagens mais antigas para as mais novas

server:
    port: ${SERVER_PORT:0}

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    instance:
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true

icompras:
    config:
        kafka:
            topics:
                pedidos-faturados: 'icompras.pedidos-faturados'
                pedidos-enviados: 'icompras.pedidos-enviados'